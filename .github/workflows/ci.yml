name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Review gate hook self-test.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Review gate hook self-test
        run: python .claude/hooks/role_gate.py --self-test

  go:
    # Go is not installed on the owner's PC; this job is where Go is verified.
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # The module has no external dependencies: a package download is an error.
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Version from go.mod (owner decision 1 of epic #1: go 1.26 by default).
          go-version-file: go.mod
          cache: false
      - name: Go version
        run: go version
      - name: gofmt
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:"; echo "$out"; exit 1; fi
      - name: go vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: go build
        if: ${{ !cancelled() }}
        run: go build ./...
      - name: go test
        # Linux is the supported host (owner decision 3 of epic #1); Windows only
        # proves that the non-Linux lease stub compiles (vet and build above).
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: go test ./...
