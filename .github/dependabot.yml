version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The module has no external dependencies by design. This entry only watches
  # the go.mod that ticket #2 adds; until then Dependabot reports "no manifest".
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
